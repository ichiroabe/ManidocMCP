name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 版は macOS ランナー、Windows 版は Windows ランナーでネイティブにビルドする。
    # 配布形式も各 OS の慣習に合わせる（macOS: tar.gz / Windows: zip）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # タグから付けたバージョンを serverInfo.version と get_server_status に反映させる。
      # タグが無いビルドでは csproj の <Version> をそのまま使う。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            VERSION_ARG="-p:Version=${{ steps.version.outputs.value }}"
          fi
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true \
            -o "dist/${{ matrix.rid }}" -p:PublishSingleFile=true $VERSION_ARG

      - name: Package (tar.gz)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "dist/${{ matrix.rid }}"
          chmod +x ManidocMCP
          tar -czf "../ManidocMCP-${{ matrix.rid }}.tar.gz" ManidocMCP appsettings.json

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/${{ matrix.rid }}/ManidocMCP.exe", "dist/${{ matrix.rid }}/appsettings.json" `
            -DestinationPath "dist/ManidocMCP-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ManidocMCP-${{ matrix.rid }}
          path: dist/ManidocMCP-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*
