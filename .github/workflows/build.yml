name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- リリース対象かどうかの判定 ---
  # リリースの起点は ManidocMCP.csproj の <Version>。main に push されたとき、
  # その version に対応する v タグがまだ無ければ自動でタグを切って公開する。
  # 手で v タグを push した場合も従来どおり動く。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 既存タグと突き合わせるため履歴とタグを全部取る
          fetch-depth: 0

      - name: Decide version and tag
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 手動でタグを push した場合は無条件でリリース
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} (タグ push) をリリースします"
            exit 0
          fi

          VERSION="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' ManidocMCP.csproj | head -1)"
          if [[ -z "${VERSION}" ]]; then
            echo "::error::ManidocMCP.csproj から <Version> を読み取れませんでした"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # PR は検証のみ（ビルドはするがリリースはしない）
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR のためリリースはしません (version=${VERSION})"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} はリリース済みのためスキップします。配布したい変更がある場合は ManidocMCP.csproj の <Version> を上げて push してください。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} を新規リリースします"
          fi

  build:
    needs: prepare
    # macOS/Linux 版はそれぞれ macOS/Ubuntu ランナー、Windows 版は Windows ランナーで
    # ネイティブにビルドする（arm64 は各 OS で x64 ランナーからクロス publish）。
    # 配布形式は各 OS の慣習に合わせる（macOS/Linux: tar.gz / Windows: zip）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # prepare が決めたバージョンを serverInfo.version と get_server_status に反映させる。
      # main への push では csproj の <Version> がそのまま入り、タグ push では
      # タグ名のバージョンが入る（どちらも prepare 側で解決済み）。
      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true \
            -o "dist/${{ matrix.rid }}" -p:PublishSingleFile=true \
            -p:Version=${{ needs.prepare.outputs.version }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "dist/${{ matrix.rid }}"
          chmod +x ManidocMCP
          tar -czf "../ManidocMCP-${{ matrix.rid }}.tar.gz" ManidocMCP appsettings.json

      # install.ps1 は Windows でしか実行されないため、せめて構文だけは CI で検証する。
      - name: Lint installer (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/install.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "installer/install.ps1: syntax OK"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.rid }}"
          $out = "dist/ManidocMCP-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$dir/ManidocMCP.exe", "$dir/appsettings.json" -DestinationPath $out

      - uses: actions/upload-artifact@v7
        with:
          name: ManidocMCP-${{ matrix.rid }}
          path: dist/ManidocMCP-${{ matrix.rid }}.*
          if-no-files-found: error

  # 6 RID 分のビルドが全部そろってから Release を1回だけ作る。
  # 1つでも失敗したら公開されない（中途半端な Release を残さない）。
  release:
    if: needs.prepare.outputs.should_release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # main への push 起点の場合、タグはここで初めて作られる（--target で今の commit に固定）
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::${TAG} の Release は既にあるのでアセットを差し替えます"
            gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
