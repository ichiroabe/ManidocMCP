name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS/Linux 版はそれぞれ macOS/Ubuntu ランナー、Windows 版は Windows ランナーで
    # ネイティブにビルドする（arm64 は各 OS で x64 ランナーからクロス publish）。
    # 配布形式は各 OS の慣習に合わせる（macOS/Linux: tar.gz / Windows: zip）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # タグから付けたバージョンを serverInfo.version と get_server_status に反映させる。
      # タグが無いビルドでは csproj の <Version> をそのまま使う。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            VERSION_ARG="-p:Version=${{ steps.version.outputs.value }}"
          fi
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true \
            -o "dist/${{ matrix.rid }}" -p:PublishSingleFile=true $VERSION_ARG

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "dist/${{ matrix.rid }}"
          chmod +x ManidocMCP
          tar -czf "../ManidocMCP-${{ matrix.rid }}.tar.gz" ManidocMCP appsettings.json

      # install.ps1 は Windows でしか実行されないため、せめて構文だけは CI で検証する。
      - name: Lint installer (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/install.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "installer/install.ps1: syntax OK"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.rid }}"
          $out = "dist/ManidocMCP-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$dir/ManidocMCP.exe", "$dir/appsettings.json" -DestinationPath $out

      - uses: actions/upload-artifact@v7
        with:
          name: ManidocMCP-${{ matrix.rid }}
          path: dist/ManidocMCP-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*
